- name: shell vs command
  hosts: local
  connection: local
  tasks:
    - name: test the command moudule
      shell: cat/etc/passwd | grep ec2-user
      register: ec2_user_output

    - name: print the output
      debug:
        msg: { { "ec2_user_output" } }
- name: get the files
  shell: ls -l > /temp.files.txt
  register: files_output
